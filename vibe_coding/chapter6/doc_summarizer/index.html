<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>족집게 요약 앱</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="page">
    <header class="header">
      <h1>📌 족집게 요약 앱</h1>
      <p class="header-sub">PDF 또는 Word(.docx) 문서를 올리면 TextRank 알고리즘으로 핵심 문장만 뽑아드려요</p>
    </header>

    <main class="card">
      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">📁</div>
        <p class="drop-title">파일을 여기로 끌어다 놓거나 클릭해서 선택하세요</p>
        <p class="drop-sub">지원 형식: PDF (.pdf), Word (.docx)</p>
        <input type="file" id="fileInput" accept=".pdf,.docx" hidden>
      </div>

      <div class="file-info hidden" id="fileInfo">
        <span class="file-icon" id="fileTypeIcon">📄</span>
        <div class="file-info-text">
          <p class="file-name" id="fileName"></p>
          <p class="file-meta" id="fileMeta"></p>
        </div>
        <button type="button" class="change-btn" id="changeBtn">다른 파일 선택</button>
      </div>

      <div class="status-row hidden" id="loadingRow">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loadingText">문서를 분석하고 핵심 문장을 찾는 중이에요...</span>
      </div>

      <p class="error-msg hidden" id="errorMsg"></p>

      <div class="summary-section hidden" id="summarySection">
        <div class="slider-row">
          <label for="lengthSlider" class="slider-label">요약 분량</label>
          <div class="length-display"><span id="lengthValue">3</span>문장</div>
        </div>
        <input type="range" id="lengthSlider" min="1" max="5" step="1" value="3" class="slider">
        <div class="slider-scale">
          <span>1문장</span>
          <span>5문장</span>
        </div>

        <div class="summary-box">
          <p class="summary-label">요약 결과</p>
          <p class="summary-text" id="summaryText"></p>
        </div>

        <p class="summary-meta" id="summaryMeta"></p>
      </div>
    </main>

    <p class="privacy-note">🔒 업로드한 문서는 서버로 전송되지 않고, 이 브라우저 안에서만 분석돼요.</p>
  </div>

  <script src="vendor/pdf-worker-inline.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="textrank.js"></script>
  <script src="script.js"></script>
</body>

</html>
