<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글자 수 세기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="page">
    <header class="header">
      <h1>✍️ 글자 수 세기</h1>
      <p class="header-sub">텍스트를 입력하면 글자 수와 바이트 수를 실시간으로 계산해드려요</p>
    </header>

    <main class="card">
      <div class="input-wrapper">
        <textarea id="textInput" placeholder="여기에 텍스트를 입력하세요..." spellcheck="false"></textarea>
        <button type="button" id="clearBtn" class="clear-btn" title="입력 지우기">지우기</button>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-value" id="charCount">0</span>
          <span class="stat-label">글자 수 (공백 포함)</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="charNoSpaceCount">0</span>
          <span class="stat-label">글자 수 (공백 제외)</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="wordCount">0</span>
          <span class="stat-label">단어 수</span>
        </div>
        <div class="stat-box highlight">
          <span class="stat-value" id="byteCount">0</span>
          <span class="stat-label">바이트 수 (한글 2byte 기준)</span>
        </div>
      </div>

      <p class="byte-note">※ 바이트 수는 영문/숫자/기호는 1byte, 한글(및 기타 2byte 문자)은 2byte로 계산해요.</p>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
